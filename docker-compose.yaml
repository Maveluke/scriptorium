services:
  app:
    build: .
    ports:
      - "3000:3000"
      - "5555:5555" # TODO: DELETE LATER! For Prisma Studio (Development)
    volumes:
      - ./prisma:/app/prisma
      - /var/run/docker.sock:/var/run/docker.sock
      - /app/temp:/app/temp
      - ./.env:/app/.env
    privileged: true
  
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./etc/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app